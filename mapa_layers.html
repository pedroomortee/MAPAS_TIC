<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Mi mapa Layers</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <style> #mapa { height: 500px; } </style>
    </head>
 
    <body>
 
        <div id="mapa">        </div>
 
            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
            <script>
                //Creamos el mapa y lo centramos en las coordenadas de Arrabal de Portillo
                const mapa = L.map('mapa').setView([41.473499, -4.590179], 13);
               
                //Creamos la capa de OpenStreetMap
                const omsStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; colaboradores de OpenStreetMap</a>'
                });
 
                //Creamos la capa de OpenTopoMap
                const openTopoMap = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{
                    maxZoom:17,
                    attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
                });
 
                openTopoMap.addTo(mapa);
 
 
                //Creamos un marcadores con un popup que se abre al hacer clic en el marcador
                const marcadorFloresGoyi = L.marker([41.475500, -4.596099])
                .bindPopup('<b>Flores Goyi</b><br>Plantas para cualquier ocasión.   <br><a href="https://floresgoyi.com/" target="_blank">Sitio web de Flores Goyi</a><br> <img src="https://floresgoyi.es/wp-content/uploads/2026/04/IMG_20260402_150529-2000x1500.jpg" width="150">')              
                .addTo(mapa);  
 
                const marcadorInstituto = L.marker([41.473337, -4.589762])
                .bindPopup('<b>Instituto de Educación Secundaria</b><br>Instituto de Educación Secundaria de la localidad.   <br><a href="https://iesvilladevalderas.es/" target="_blank">Sitio web del Instituto</a><br> <img src="https://iesvilladevalderas.es/wp-content/uploads/2023/09/IMG_20230919_094905-2000x1500.jpg" width="150">')
                .addTo(mapa);  
 
                const marcadorKache = L.marker([41.47266, -4.590471])
                .bindPopup('<b>Kache</b><br>Restaurante de comida rápida.   <br><a href="https://www.kacheburgos.com/" target="_blank">Sitio web de Kache</a><br> <img src="https://www.kacheburgos.com/wp-content/uploads/2023/09/IMG_20230919_094905-2000x1500.jpg" width="150">')
                .addTo(mapa);
 
 
                //Creamos elementos gráficos como polilíneas, círculos y polígonos y los agregamos al mapa
                const miPolilinea = L.polyline([
                        [41.475500, -4.596099], // Arrabal
                        [41.475000, -4.594500],
                        [41.474300, -4.592800],
                        [41.473600, -4.591500],
                        [41.473214, -4.590118],
                        [41.472900, -4.589500],
                        [41.472637, -4.590515],
                        [41.471800, -4.592000],
                        [41.470900, -4.593500]
                    ], {
                        color: 'green',
                        weight: 4
                    }).addTo(mapa);
 
                const miCirculo = L.circle([41.479149, -4.587835], {
                        color: 'red',
                        fillColor: '#f03',
                        fillOpacity: 0.5,
                        radius: 50})
                        .addTo(mapa)
                        .bindPopup('Radio de 50 metros alrededor del castillo de Arrabal.');
 
               const miPoligono = L.polygon([
                    [41.473300, -4.592000],
                    [41.473600, -4.591000],
                    [41.473400, -4.589800],
                    [41.472900, -4.589100],
                    [41.472300, -4.589000],
                    [41.471700, -4.589500],
                    [41.471500, -4.590600],
                    [41.471700, -4.591600],
                    [41.472200, -4.592200],
                    [41.472900, -4.592400]
                ], {
                    color: 'blue',
                    fillColor: '#30f',
                    fillOpacity: 0.5
                })
                .addTo(mapa)
                .bindPopup('Polígono alrededor de la zona del Instituto de Arrabal.');
               
                //Creamos un listado con los mapas estándar y topográfico
                const baseMaps = {
                    "Mapa de tipo Estándar": omsStandard,
                    "Mapa topográfico": openTopoMap
                };
 
                //Creamos un listado con los marcadores
                const overlayMaps = {
                    "Flores Goyi": marcadorFloresGoyi,
                    "Instituto": marcadorInstituto,
                    "Kache": marcadorKache,
                }
 
                //Creamos un grupo con los marcadores, y otro con los elemento gráficos
                const grupoMarcadores = L.layerGroup([marcadorFloresGoyi, marcadorInstituto, marcadorKache]);
                const grupoElementosGraficos = L.layerGroup([miPolilinea, miCirculo, miPoligono]);
 
                //Creamos un listado con los grupos de marcadores y elementos gráficos
                const overlayMapsGrupos = {
                    "Grupo de Marcadores": grupoMarcadores,
                    "Grupo de Elementos Gráficos": grupoElementosGraficos
                };
 
                //Agregamos el control de capas al mapa
                L.control.layers(baseMaps, overlayMapsGrupos).addTo(mapa);
 
       </script>
    </body>
</html>
